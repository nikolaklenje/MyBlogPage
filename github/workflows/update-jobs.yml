name: Update jobs

on:
  schedule:
    - cron: '0 12 * * *' # 08:00 Miami time (12:00 UTC)
  workflow_dispatch: # adds a manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch jobs
        run: python scripts/jobscout/filter.py --json --out src/data/jobs.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/jobs.json scripts/jobscout/seen.json
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: update jobs data"
            git push
          fi
